<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Proof ROI Engine</title>
</head>
<body>

<div id="root"></div>
<script>
  import fs from "node:fs/promises";
  import path from "node:path";
  import { execFile } from "node:child_process";
  import { promisify } from "node:util";

const execFileAsync = promisify(execFile);

// Dossier courant : lancer ce script depuis la racine du projet
const rootDir = process.cwd();

const scriptPath = path.join(
  rootDir,
  "scripts",
  "extract-workbook-factors.mjs"
);

const workbookPath = path.join(
  rootDir,
  "The Proof ROI Engine.xlsx"
);

const outputPath = path.join(
  rootDir,
  "src",
  "generated",
  "workbookFactors.js"
);

const standaloneTemplatePath = path.join(
  rootDir,
  "standalone-template.html"
);

const standaloneOutputPath = path.join(
  rootDir,
  "standalone-demo.html"
);

console.log("ROOT:", rootDir);
console.log("SCRIPT:", scriptPath);
console.log("WORKBOOK:", workbookPath);
console.log("OUTPUT:", outputPath);
console.log("STANDALONE TEMPLATE:", standaloneTemplatePath);
console.log("STANDALONE OUTPUT:", standaloneOutputPath);

// Vérification du fichier Excel
try {
  await fs.access(workbookPath);
  console.log("✅ Excel trouvé");
} catch {
  console.error("❌ Excel introuvable :", workbookPath);
  process.exit(1);
}

// Vérification du script extract
try {
  await fs.access(scriptPath);
  console.log("✅ Script extract trouvé");
} catch {
  console.error("❌ Script extract introuvable :", scriptPath);
  process.exit(1);
}

try {
  await fs.access(standaloneTemplatePath);
  console.log("✅ Template standalone trouvé");
} catch {
  console.error("❌ Template standalone introuvable :", standaloneTemplatePath);
  process.exit(1);
}

// Exécution de l’extracteur
let stdout = "";
let stderr = "";

try {
  const result = await execFileAsync(
    "node",
    [scriptPath, workbookPath],
    {
      cwd: rootDir,
      maxBuffer: 1024 * 1024 * 10
    }
  );

  stdout = result.stdout;
  stderr = result.stderr;
} catch (error) {
  console.error("❌ Échec de l’exécution du script extract");

  if (error.stdout) {
    console.error("STDOUT reçu :");
    console.error(error.stdout);
  }

  if (error.stderr) {
    console.error("STDERR reçu :");
    console.error(error.stderr);
  }

  console.error("Erreur :", error.message);
  process.exit(1);
}

// Les logs humains de l’extract doivent arriver ici
if (stderr?.trim()) {
  console.error(stderr.trim());
}

// Parse JSON
const cleanStdout = stdout.trim();

if (!cleanStdout) {
  console.error("❌ L’extract n’a renvoyé aucun JSON dans stdout");
  process.exit(1);
}

let parsed;

try {
  parsed = JSON.parse(cleanStdout);
} catch (e) {
  console.error("❌ JSON cassé");
  console.error("STDOUT reçu :");
  console.error(stdout);
  console.error("Erreur JSON :", e.message);
  process.exit(1);
}

const matrix = parsed.matrix ?? parsed;

if (!matrix || typeof matrix !== "object" || Array.isArray(matrix)) {
  console.error("❌ Matrix invalide");
  console.error(parsed);
  process.exit(1);
}

if (Object.keys(matrix).length === 0) {
  console.error("❌ Matrix vide : aucun vertical/scenario extrait");
  console.error("Vérifie l’onglet Excel 'Vertical Parameters' et les colonnes A/B/C/D.");
  process.exit(1);
}

// Génération du fichier JS
await fs.mkdir(path.dirname(outputPath), { recursive: true });

await fs.writeFile(
  outputPath,
  `// Auto-generated by build-standalone.mjs. Do not edit manually.

export const workbookFactors = ${JSON.stringify(matrix, null, 2)};
`,
  "utf8"
);

console.log("✅ DONE:", outputPath);
console.log("✅ Verticals generated:", Object.keys(matrix).join(", "));

const standaloneTemplate = await fs.readFile(standaloneTemplatePath, "utf8");
await fs.writeFile(standaloneOutputPath, standaloneTemplate, "utf8");
console.log("✅ STANDALONE GENERATED:", standaloneOutputPath);
</script>

</body>
</html>
