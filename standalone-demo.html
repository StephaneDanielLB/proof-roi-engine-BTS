<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BuyTryShare | Proof ROI Engine</title>
<style>
@font-face {
  font-family: "Open Sans";
  src: url("./assets/fonts/OpenSans-Light.woff2") format("woff2");
  font-weight: 300;
  font-style: normal;
  font-display: swap;
}

@font-face {
  font-family: "Open Sans";
  src: url("./assets/fonts/OpenSans-SemiBold.woff2") format("woff2");
  font-weight: 600;
  font-style: normal;
  font-display: swap;
}

@font-face {
  font-family: "Open Sans";
  src: url("./assets/fonts/OpenSans-Bold.woff2") format("woff2");
  font-weight: 700;
  font-style: normal;
  font-display: swap;
}

html {
  -webkit-font-smoothing: antialiased;
}

* {
  font-family: "Open Sans", Arial, sans-serif !important;
}

body {
  font-family: "Open Sans", Arial, sans-serif !important;
}

:root {
  color-scheme: dark;
  --bg: #0b0b0f;
  --panel: #11141b;
  --panel-2: #141923;
  --panel-3: #0f131a;
  --line: rgba(108, 132, 171, 0.18);
  --line-strong: rgba(102, 194, 255, 0.32);
  --text: #f3f7fb;
  --muted: #95a2b7;
  --cyan: #66c2ff;
  --input-blue: #4da3ff;
  --success: #22c55e;
  --danger-strong: #ef4444;
  --blue: #4f7fff;
  --direct: #35589d;
  --proof: #66c2ff;
  --warning: #cdb488;
  --danger: #c9828d;
  --shadow: 0 24px 60px rgba(0, 0, 0, 0.34);
  --radius-xl: 28px;
  --radius-lg: 22px;
  --radius-md: 16px;
}

* {
  box-sizing: border-box;
}

html,
body {
  min-height: 100%;
  background: var(--bg);
}

body {
  margin: 0;
  font-family: "Open Sans", Arial, sans-serif !important;
  color: var(--text);
  background:
    radial-gradient(circle at 100% 0%, rgba(79, 127, 255, 0.08), transparent 26%),
    radial-gradient(circle at 0% 0%, rgba(102, 194, 255, 0.06), transparent 28%),
    #0b0b0f;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
  background-size: 72px 72px;
  mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.9), transparent 82%);
  pointer-events: none;
}

.app-shell {
  position: relative;
  width: min(95vw, 1800px);
  margin: 0 auto;
  padding: 24px 0 36px;
}

.panel,
.headline-card,
.proof-mark-card {
  background: rgba(17, 20, 27, 0.94);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  box-sizing: border-box;
  max-width: 100%;
  width: 100%;
}

.topbar {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 28px;
  padding: 8px 14px 13px;
}

.brand-lockup {
  display: flex;
  align-items: center;
  min-width: 0;
  flex: 0 1 auto;
}

.header-spacer {
  flex: 1 1 auto;
  min-width: 24px;
}

.brand-logo {
  width: clamp(250px, 22vw, 300px);
  min-width: 220px;
  max-width: 300px;
  height: auto;
  object-fit: contain;
  display: block;
}

.product-lockup {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  margin-left: auto;
  flex: 0 1 auto;
}

.proof-logo-inline {
  width: clamp(176px, 14vw, 220px);
  min-width: 176px;
  max-width: 220px;
  height: auto;
  max-height: 112px;
  object-fit: contain;
  object-position: right center;
  display: block;
  margin-left: auto;
}
.hero-line,
.section-label,
.panel-note,
.decision-text,
.definition-card p,
.field-group-header p,
.field small,
.footer-signature,
.kpi-disclaimer,
.scenario-card small,
.impact-card small,
.headline-card span,
.headline-card small {
  margin: 0;
}

.top-overview,
.impact-brand-grid,
.control-grid,
.workspace-grid,
.detail-grid,
.metric-grid,
.impact-grid {
  display: grid;
  gap: 20px;
  margin-top: 20px;
}

.panel {
  padding: 24px;
  border-radius: var(--radius-xl);
}

.top-overview {
  grid-template-columns: 1fr;
  align-items: start;
  gap: 32px;
}

.economics-overview {
  margin-bottom: 0;
}

.overview-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
}

.overview-column {
  background: rgba(20, 30, 50, 0.6);
  border-radius: 16px;
  padding: 20px;
  border: 1px solid rgba(120, 140, 180, 0.2);
}

.overview-column h3 {
  font-size: 14px;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin: 0 0 16px;
  opacity: 0.7;
}

.metric {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  padding: 10px 0;
  border-bottom: 1px solid rgba(120, 140, 180, 0.1);
}

.metric:last-child {
  border-bottom: 0;
}

.metric label {
  font-size: 13px;
  opacity: 0.7;
  max-width: 65%;
  line-height: 1.3;
  white-space: normal;
}

.metric value {
  display: block;
  min-width: 140px;
  font-size: 20px;
  font-weight: 600;
  white-space: nowrap;
  flex-shrink: 0;
  text-align: right;
}

.metric.positive value {
  color: #22c55e;
}

.metric.negative value {
  color: #ef4444;
}

.economics-breakdown {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.eco-section {
  padding: 16px;
  border-radius: 12px;
  background: rgba(20, 30, 50, 0.4);
}

.eco-section h4 {
  font-size: 12px;
  text-transform: uppercase;
  opacity: 0.6;
  margin: 0 0 10px;
}

.eco-section.total {
  border: 1px solid rgba(80, 200, 120, 0.4);
  background: rgba(20, 40, 30, 0.4);
}

.negotiation-block {
  margin-top: 20px;
  padding: 16px;
  border-radius: 12px;
  background: rgba(30, 40, 70, 0.4);
  display: grid;
  gap: 14px;
}

.negotiation-block h3 {
  margin: 0;
}

.negotiation-block .panel-note,
.negotiation-block .factors-grid,
.negotiation-block .preview-warning-list {
  margin-top: 0;
}

.rate-card-preview-panel {
  display: grid;
  gap: 14px;
}

.rate-card-preview-panel .panel-note {
  margin: 0;
}

.rate-card-preview-chip-row {
  margin-top: 0;
  margin-bottom: 0;
}

.rate-card-preview-selectors {
  flex-wrap: wrap;
  margin-top: 0;
}

.rate-card-preview-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.rate-card-preview-meta strong {
  font-size: 1rem;
}

.rate-card-preview-custom-grid {
  margin-top: 0;
  flex-wrap: wrap;
}

.rate-card-preview-custom-grid .factor {
  flex-direction: column;
  align-items: stretch;
  gap: 8px;
}

.rate-card-preview-custom-grid input {
  width: 100%;
  padding: 12px 14px;
  border-radius: 14px;
  border: 1px solid rgba(255, 255, 255, 0.06);
  background: var(--panel-3);
  color: var(--text);
  font: inherit;
}

.rate-card-preview-grid {
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
}

.rate-card-preview-grid .metric-card,
.rate-card-preview-grid .value-strong {
  min-width: 0;
}

.rate-card-preview-grid .value-strong {
  display: block;
  white-space: normal;
  overflow-wrap: anywhere;
  word-break: break-word;
}

.rate-card-section {
  display: grid;
  gap: 4px;
}

.rate-group {
  margin-bottom: 20px;
}

.rate-group:last-child {
  margin-bottom: 0;
}

.rate-group h4 {
  font-size: 12px;
  opacity: 0.6;
  margin: 0 0 8px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.preview-warning-list {
  display: grid;
  gap: 8px;
}

.preview-warning-list p {
  margin: 0;
  color: var(--muted);
  line-height: 1.45;
}

.rate-card-application-state {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  width: fit-content;
  padding: 8px 12px;
  border-radius: 999px;
  background: rgba(148, 163, 184, 0.12);
  color: var(--muted);
  font-size: 0.88rem;
  line-height: 1.3;
}

.rate-card-application-dot {
  width: 8px;
  height: 8px;
  border-radius: 999px;
  background: currentColor;
  flex: 0 0 auto;
}

.rate-card-application-state.tone-applied {
  background: rgba(34, 197, 94, 0.12);
  color: #86efac;
}

.rate-card-application-state.tone-pending {
  background: rgba(251, 191, 36, 0.12);
  color: #fbbf24;
}

.rate-card-application-state.tone-inactive {
  background: rgba(148, 163, 184, 0.12);
  color: #cbd5e1;
}

.rate-card-methodology-ref {
  margin-top: 12px;
}

.rate-card-methodology-panel {
  margin-top: 24px;
}

.rate-card-methodology-list {
  display: grid;
  gap: 8px;
}

.rate-card-methodology-list p {
  margin: 0;
  display: grid;
  grid-template-columns: 170px minmax(0, 1fr);
  gap: 8px;
  font-size: 0.9rem;
  line-height: 1.5;
}

.rate-card-methodology-label {
  color: var(--muted);
  font-weight: 500;
}

.rate-card-methodology-value {
  color: var(--muted);
}

.preview-error-list {
  padding: 16px;
  border-radius: 14px;
  background: rgba(127, 29, 29, 0.18);
  border: 1px solid rgba(248, 113, 113, 0.24);
}

.rate-card-preview-warning {
  color: var(--muted);
  max-width: 92%;
}

.selectors {
  display: flex;
  gap: 16px;
  margin-top: 12px;
}

.selector-field {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.selector-label {
  color: var(--input-blue);
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.selectors select {
  width: 100%;
  padding: 12px 14px;
  border-radius: 14px;
  border: 1px solid rgba(255, 255, 255, 0.06);
  background: var(--panel-3);
  color: var(--text);
  font: inherit;
}

.factors-grid {
  display: flex;
  gap: 20px;
  margin-top: 10px;
}

.factor {
  flex: 1;
  display: flex;
  justify-content: space-between;
  gap: 16px;
  align-items: center;
}

.factor label {
  color: var(--muted);
  line-height: 1.3;
}

.factor value {
  white-space: nowrap;
  font-size: 20px;
  font-weight: 600;
}

.factor-input-wrap {
  flex: 0 0 130px;
  width: 130px;
}

.factor-input-wrap input {
  text-align: right;
}

.value-positive {
  color: var(--success);
  text-shadow: 0 0 6px rgba(34, 197, 94, 0.3);
}

.value-negative {
  color: var(--danger-strong);
  text-shadow: 0 0 6px rgba(239, 68, 68, 0.3);
}

.hero-decision {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 18px;
  padding: 36px 32px;
}

.hero-title {
  margin: 0;
  font-size: clamp(1.25rem, 1.5vw, 1.7rem);
  letter-spacing: 0.12em;
  font-weight: 700;
  color: var(--text);
}

.hero-value-wrap {
  width: 100%;
  display: flex;
  justify-content: center;
}

.hero-value {
  font-size: clamp(3.6rem, 8vw, 7rem);
  line-height: 0.95;
  font-weight: 700;
  letter-spacing: -0.06em;
  white-space: nowrap;
  word-break: keep-all;
  overflow-wrap: normal;
}

.hero-value.value-negative {
  text-shadow: 0 0 18px rgba(239, 68, 68, 0.35);
}

.hero-value.value-positive {
  text-shadow: 0 0 18px rgba(34, 197, 94, 0.35);
}

.hero-subtitle {
  margin: 0;
  font-size: 1.08rem;
  line-height: 1.5;
  color: var(--muted);
}

.hero-cause {
  display: grid;
  gap: 8px;
}

.hero-cause p {
  margin: 0;
  font-size: clamp(1.05rem, 1.5vw, 1.3rem);
  font-weight: 600;
  color: var(--text);
}

/*
LOCKED LAYOUT
- 4 KPIs = 1 row
- 3 KPIs = 1 row
DO NOT MODIFY
*/

.decision-contrast-grid {
  margin-top: 20px;
}

.kpi-row {
  display: flex;
  gap: 16px;
  width: 100%;
  margin-top: 16px;
}

.kpi-row .kpi-card {
  flex: 1;
  min-width: 0;
}

.contrast-card {
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: flex-start;
}

.contrast-card span {
  color: var(--muted);
  font-size: 0.84rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-weight: 700;
}

.contrast-value {
  font-size: clamp(2rem, 3vw, 3.3rem);
  line-height: 1;
  font-weight: 700;
  letter-spacing: -0.05em;
}

.contrast-helper {
  margin: 0;
  color: rgba(214, 222, 241, 0.66);
  font-size: 0.8rem;
  line-height: 1.45;
}

.comparison-toggle-row,
.comparison-delta-block {
  margin-top: 20px;
}

.top-kpi-row {
  display: flex;
  gap: 20px;
  align-items: stretch;
  margin-bottom: 0;
}

.top-kpi-row .card {
  width: 100%;
}

.interpretation-card {
  flex: 2;
  min-width: 0;
}

.model-card {
  flex: 1;
  max-width: 360px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
}

.interpretation-text-block p {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.model-toggle {
  display: flex;
  justify-content: flex-end;
  gap: 12px;
  margin-top: 4px;
}

.decision-contrast-grid.kpi-row {
  margin-top: 32px;
}

.comparison-toggle-chip-row .chip {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  min-width: 170px;
  text-align: center;
}

.chip-subcopy {
  font-size: 0.72rem;
  font-weight: 500;
  letter-spacing: 0.02em;
  text-transform: none;
  color: rgba(214, 222, 241, 0.68);
}

.comparison-delta-grid {
  gap: 16px;
}

.incremental-row {
  display: flex;
  gap: 16px;
  width: 100%;
  margin-top: 16px;
}

.incremental-row .kpi-card {
  flex: 1;
  min-width: 0;
}

.kpi-value.positive {
  color: #22c55e !important;
}

.kpi-value.negative {
  color: #ef4444 !important;
}

.executive-summary-strip {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
  margin-top: 20px;
  padding: 18px 22px;
}

.executive-summary-head {
  grid-column: 1 / -1;
}

.executive-summary-head .section-label {
  display: inline-block;
  margin-bottom: 2px;
}

.executive-summary-item {
  display: grid;
  gap: 6px;
  min-width: 0;
}

.executive-summary-item span {
  color: var(--muted);
  font-size: 0.82rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-weight: 700;
}

.executive-summary-item strong {
  font-size: clamp(1.15rem, 1.8vw, 1.6rem);
  line-height: 1.1;
  color: var(--text);
}

.executive-summary-item small {
  color: rgba(214, 222, 241, 0.72);
  font-size: 0.86rem;
  line-height: 1.45;
}

.killer-insight-card {
  margin-top: 20px;
  display: grid;
  gap: 10px;
}

.killer-insight-card h2 {
  font-size: clamp(0.95rem, 1.4vw, 1.26rem);
}

.killer-insight-card.positive {
  border-color: rgba(34, 197, 94, 0.28);
  background: linear-gradient(180deg, rgba(20, 41, 31, 0.96), rgba(12, 18, 23, 0.98));
}

.killer-insight-card.warning {
  border-color: rgba(205, 180, 136, 0.26);
  background: linear-gradient(180deg, rgba(38, 31, 18, 0.96), rgba(12, 18, 23, 0.98));
}

.killer-insight-card.negative {
  border-color: rgba(201, 130, 141, 0.3);
  background: linear-gradient(180deg, rgba(43, 24, 29, 0.96), rgba(12, 18, 23, 0.98));
}

.killer-insight-support {
  margin: 0;
  color: rgba(226, 232, 240, 0.84);
  font-size: 0.83rem;
  line-height: 1.55;
}

.killer-insight-disclaimer {
  margin: 0;
  color: rgba(214, 222, 241, 0.62);
  font-size: 0.82rem;
  line-height: 1.4;
}

.hero-kpi-header,
.panel-header,
.panel-header.compact {
  display: flex;
  justify-content: space-between;
  align-items: start;
  gap: 16px;
}

.section-label {
  color: var(--input-blue);
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

h1,
h2,
h3,
.kpi-label {
  font-family: "Open Sans", Arial, sans-serif !important;
}

h2,
h3 {
  margin: 0;
  font-weight: 600;
  letter-spacing: -0.02em;
}

h2 {
  font-size: 1.42rem;
}

h3 {
  font-size: 1rem;
}

.decision-pill {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 118px;
  padding: 10px 14px;
  border-radius: 999px;
  border: 1px solid transparent;
  font-size: 0.8rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.decision-pill.positive {
  color: var(--cyan);
  border-color: rgba(102, 194, 255, 0.22);
  background: rgba(102, 194, 255, 0.08);
}

.decision-pill.warning {
  color: var(--warning);
  border-color: rgba(205, 180, 136, 0.22);
  background: rgba(205, 180, 136, 0.08);
}

.decision-pill.negative {
  color: var(--danger);
  border-color: rgba(201, 130, 141, 0.22);
  background: rgba(201, 130, 141, 0.08);
}

.kpi-disclaimer,
.panel-note,
.definition-card p,
.field-group-header p,
.field small,
.decision-text,
.scenario-card small,
.impact-card small {
  color: var(--muted);
  line-height: 1.6;
  font-size: 0.92rem;
}

.hero-graph {
  display: grid;
  gap: 14px;
  margin-top: 24px;
  padding-top: 18px;
  border-top: 1px solid rgba(255, 255, 255, 0.06);
}

.hero-graph-row,
.mini-graph-row {
  display: grid;
  grid-template-columns: 110px minmax(0, 1fr) auto;
  gap: 14px;
  align-items: center;
}

.hero-graph-row span,
.mini-graph-row span,
.impact-card span,
.metric-card span,
.split-stat span,
.scenario-card span {
  color: var(--muted);
  font-size: 0.9rem;
}

.hero-bar-track,
.mini-track,
.impact-meter {
  width: 100%;
  overflow: hidden;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.05);
}

.hero-bar-track,
.mini-track {
  height: 12px;
}

.hero-bar,
.mini-fill,
.impact-meter-segment {
  height: 100%;
  border-radius: 999px;
}

.hero-bar.direct,
.mini-fill.direct,
.impact-meter-segment.direct {
  background: var(--direct);
}

.hero-bar.proof,
.mini-fill.proof,
.impact-meter-segment.proof {
  background: var(--proof);
}

.hero-graph-row strong,
.mini-graph-row strong {
  color: var(--text);
  font-weight: 700;
}

.value-light {
  font-weight: 300;
  font-size: clamp(18px, 1.8vw, 32px);
  line-height: 1.2;
  letter-spacing: -0.05em;
  min-width: 0;
  white-space: nowrap;
  word-break: keep-all;
  overflow-wrap: normal;
}

.value-strong {
  font-weight: 700;
  font-size: clamp(18px, 1.8vw, 32px);
  line-height: 1.2;
  letter-spacing: -0.04em;
  min-width: 0;
  white-space: nowrap;
  word-break: keep-all;
  overflow-wrap: normal;
}

.metric-card small {
  display: block;
  margin-top: 4px;
  color: rgba(214, 222, 241, 0.62);
  font-size: 0.78rem;
  line-height: 1.45;
}

.impact-brand-grid {
  grid-template-columns: 1fr;
  align-items: start;
  gap: 20px;
}

.decision-panel.positive {
  border-color: rgba(102, 194, 255, 0.28);
}

.decision-panel.warning {
  border-color: rgba(205, 180, 136, 0.28);
}

.decision-panel.neutral {
  border-color: rgba(108, 132, 171, 0.24);
}
